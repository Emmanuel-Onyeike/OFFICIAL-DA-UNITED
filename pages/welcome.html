<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <link rel="stylesheet" href="../css/welcome.css">
</head>
<body class="welcome-body">
  <div class="welcome-glow"></div>
  <main class="welcome-main">
    <div class="welcome-logo">
      <img src="../img/logo.png" alt="Club logo"
        onerror="this.style.display='none'; this.nextElementSibling.classList.add('is-visible');">
      <span class="welcome-logo-fallback">FC</span>
    </div>
    <h1 class="welcome-title">Welcome to the club</h1>
    <p class="welcome-sub">
      Sign in to your account or create one to access the team dashboard, roster, and match updates.
    </p>
    <div class="welcome-actions">
      <a href="login.html" class="btn-primary">Log in</a>
      <a href="register.html" class="btn-secondary">Create account</a>
    </div>
  </main>
  <footer class="welcome-footer">Official team portal</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in</title>
  <link rel="stylesheet" href="../css/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../script/supabase-client.js"></script>
</head>
<body class="auth-body">
  <div class="auth-shell">
    <section class="auth-form-panel">
      <a href="welcome.html" class="auth-back">← Back</a>

      <div class="auth-visual-mobile">
        <img src="../img/auth-side.jpg" alt="" onerror="this.src='../img/logo.png'">
        <div class="auth-visual-mobile-overlay"></div>
      </div>

      <div class="auth-form-inner">
        <div class="auth-brand">
          <div class="auth-brand-logo">
            <img src="../img/logo.png" alt="Club logo"
              onerror="this.style.display='none'; this.nextElementSibling.classList.add('is-visible');">
            <span class="auth-brand-fallback">FC</span>
          </div>
          <div>
            <div class="auth-brand-name">Club Portal</div>
            <div class="auth-brand-tag">Team access</div>
          </div>
        </div>

        <h1 class="auth-heading">Welcome back</h1>
        <p class="auth-sub">Log in to open your dashboard, fixtures, and team updates.</p>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="loginEmail">Email</label>
            <input class="auth-input" id="loginEmail" name="email" type="email" autocomplete="email" placeholder="you@email.com" required>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="loginPassword">Password</label>
            <input class="auth-input" id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          </div>

          <div class="auth-row">
            <label class="auth-check">
              <input type="checkbox" id="rememberMe" name="remember">
              Remember me
            </label>
            <a href="#" class="auth-link">Forgot password?</a>
          </div>

          <p id="loginMsg" class="auth-msg" role="status"></p>
          <button type="submit" class="auth-submit" id="loginBtn">Log in</button>
        </form>

        <p class="auth-footer-line">
          No account yet? <a href="register.html">Create one</a>
        </p>
      </div>
    </section>

    <aside class="auth-visual" aria-hidden="true">
      <img class="auth-visual-img" src="/img/LOGO.PNG" alt="" onerror="this.style.display='none'">
      <div class="auth-visual-overlay"></div>
      <div class="auth-visual-content">
        <span class="auth-visual-badge">Match day ready</span>
        <h2 class="auth-visual-title">One club. One portal.</h2>
        <p class="auth-visual-text">
          Access squad lists, training notes, and results in one place.
        </p>
      </div>
    </aside>
  </div>

  <script src="/scripts/login.js"></script>
</body>
</html>
